[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neon3-inventory-case"
version = "0.1.0"
description = "A self-contained Neon3 declarative inventory UI teaching case"
requires-python = ">=3.10"
dependencies = ["neon3-sdk>=0.1.2"]

[project.scripts]
neon3-inventory-demo = "src.inventory_demo:main"
neon3-inventory-probe = "src.inventory_probe:main"

[tool.setuptools.packages.find]
where = ["."]
